stages:
  - build
  - deploy
  - release

variables:
  APPLICATION_NAME: food-manager
  CONTAINER_IMAGE: ${DOCKER_HUB_USERNAME}/${APPLICATION_NAME}
  # Every master push is built and deployed under its commit SHA
  CONTAINER_IMAGE_TAGGED: ${CONTAINER_IMAGE}:${CI_COMMIT_SHORT_SHA}
  KUBECTL_CONTEXT: moreillon_ci/moreillon_k8s_home/kubernetes-agent:home-talos

image: moreillon/ci-dind
services:
  - name: docker:24.0.7-dind

.docker-login: &docker-login
  - echo "${DOCKER_HUB_PASSWORD}" | docker login --username ${DOCKER_HUB_USERNAME} --password-stdin

build:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script: *docker-login
  script:
    - docker build --build-arg APP_VERSION=${CI_COMMIT_SHORT_SHA} -t ${CONTAINER_IMAGE_TAGGED} .
    - docker push ${CONTAINER_IMAGE_TAGGED}

deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - kubectl config use-context ${KUBECTL_CONTEXT}
    - kubectl config set-context --current --namespace=${KUBERNETES_NAMESPACE}
    - envsubst < kubernetes_manifest.yml | kubectl apply -f -

# Release tags (vX.Y.Z) are created in the GitLab UI (Code > Tags).
# No rebuild: the image already built for the tagged commit is promoted to the version tag and :latest,
# with only the displayed app version overridden.
release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script: *docker-login
  script:
    - >
      printf 'FROM %s\nENV NUXT_PUBLIC_APP_VERSION=%s\n' "${CONTAINER_IMAGE_TAGGED}" "${CI_COMMIT_TAG}"
      | docker build -t ${CONTAINER_IMAGE}:${CI_COMMIT_TAG} -t ${CONTAINER_IMAGE}:latest -
    - docker push ${CONTAINER_IMAGE}:${CI_COMMIT_TAG}
    - docker push ${CONTAINER_IMAGE}:latest
